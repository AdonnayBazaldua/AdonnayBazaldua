name: Refresh profile cards
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.METRICS_TOKEN }} # classic PAT with repo + read:user, so private activity is counted
    steps:
      - uses: actions/checkout@v4
      - run: |
          [ -n "$GH_TOKEN" ] || { echo "METRICS_TOKEN not set, skipping"; exit 0; }
          python3 scripts/cards.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Refresh profile cards" && git push; }
